[project]
name = "qodo-cli"
version = "0.12.0"
description = "Community CLI and agent to manage Qodo — the AI code reviewer and Qodo's other agents (requires a Qodo subscription). Unofficial: not affiliated with, authorized, or endorsed by Qodo; the Qodo name and trademark belong to Qodo Ltd."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

# Optional extras: the base install stays dependency-free.
[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30"]
mcp = ["mcp>=1.2,<2"]
# `findings fix` publishes its event on the mesh's bus through events-cli (it brings paho-mqtt).
events = ["events-cli>=0.10"]

[project.urls]
Homepage = "https://github.com/agentculture/qodo-cli"
Issues = "https://github.com/agentculture/qodo-cli/issues"

[project.scripts]
qodo-cli = "qodo.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qodo"]

# hatch_build.py force-includes the built web UI (web/dist) as qodo/web_dist (wheel and sdist).
# It packages an existing build and never runs Node; release CI builds web/ first.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "mcp>=1.2,<2",
    "cryptography>=42",  # test-only: signs the fake Access JWTs
    "pyyaml>=6.0",  # test-only: parses the workflow files
    "events-cli>=0.10",  # test-only: the real envelope validates the fix-request event
]

[tool.coverage.run]
source = ["qodo"]
omit = ["qodo/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=qodo (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["qodo"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["schema_only: built against the recorded input schema only; no successful upstream reply was ever seen"]
